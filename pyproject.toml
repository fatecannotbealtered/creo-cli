[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "creo-cli"
dynamic = ["version"]
description = "Agent-native Creo Parametric operations with guarded workflows and explicit verification"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{name = "Sean Guo"}]
dependencies = []

[project.optional-dependencies]
native = ["pywin32==312; sys_platform == 'win32'"]

[project.scripts]
creo-cli = "creo_cli.cli:main"

[tool.setuptools.dynamic]
version = {attr = "creo_cli.__version__"}

[tool.setuptools.packages.find]
include = ["creo_cli*"]

[tool.setuptools.package-data]
creo_cli = ["CHANGELOG.md"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
