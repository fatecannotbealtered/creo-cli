name: Release gate (publishing intentionally disabled)
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/version.py --check
      - run: python scripts/test.py
      - run: python scripts/bootstrap_spec.py --check
      - run: python scripts/release_gate.py
      # No release/npm upload job until conformance and real Creo evidence exist.
